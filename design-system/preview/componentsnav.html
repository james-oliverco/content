<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Oliver Co — Navigation</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--oc-bone); padding: 0; font-family: var(--oc-font-sans); color: var(--oc-ink); }
  .anno {
    font-family: var(--oc-font-mono); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--oc-stone);
    padding: 12px 48px; display: flex; justify-content: space-between;
    border-bottom: var(--oc-hairline);
  }
  .nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 32px 48px;
    border-bottom: var(--oc-hairline);
    column-gap: 64px;
  }
  .mark {
    font-weight: 400;
    letter-spacing: 0.24em;
    font-size: 15px;
    white-space: nowrap;
  }
  .links {
    display: flex; gap: 40px;
    justify-self: center;
  }
  .link {
    font-family: var(--oc-font-sans); font-weight: 500; font-size: 11px;
    letter-spacing: 0.20em; text-transform: uppercase; color: var(--oc-graphite);
    text-decoration: none; transition: opacity 220ms;
    white-space: nowrap;
  }
  .link:hover { opacity: 0.6; }
  .link.active { color: var(--oc-ink); position: relative; }
  .link.active::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: -32px;
    height: 1px; background: var(--oc-ink);
  }
  .right {
    display: flex; gap: 28px; align-items: center;
    justify-self: end;
  }
  .bag {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--oc-graphite); text-decoration: none;
    transition: opacity 220ms;
  }
  .bag:hover { opacity: 0.6; }
  .bag svg { display: block; }
  .bag-count {
    font-family: var(--oc-font-mono); font-size: 11px;
    letter-spacing: 0.04em; color: var(--oc-graphite);
  }
</style>
</head>
<body>
  <div class="anno"><span>— LDN · 51.5074° N</span><span>EDITION No. 04 / 24</span></div>
  <div class="nav">
    <div class="mark">OLIVER&nbsp;CO</div>
    <div class="links">
      <a class="link active" href="#">Shop</a>
      <a class="link" href="#">Materials</a>
      <a class="link" href="#">Studies</a>
      <a class="link" href="#">Journal</a>
      <a class="link" href="#">About</a>
    </div>
    <div class="right">
      <span class="link">Search</span>
      <span class="link">Account</span>
      <a class="bag" href="#" aria-label="Bag, 2 items">
        <svg viewBox="0 0 20 22" width="18" height="20" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
          <path d="M2 7 H18 L17 21 H3 Z"/>
          <path d="M6.5 7 V5.5 a3.5 3.5 0 0 1 7 0 V7"/>
        </svg>
        <span class="bag-count">02</span>
      </a>
    </div>
  </div>
</body>
</html>
