<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Oliver Co — Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--oc-bone); padding: 24px 28px; font-family: var(--oc-font-sans); color: var(--oc-ink); }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 16px; }
  .eye  { font-family: var(--oc-font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--oc-stone); }
  .row { display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; gap: 16px; padding: 6px 0; }
  .tok { font-family: var(--oc-font-mono); font-size: 11px; color: var(--oc-graphite); }
  .bar { height: 8px; background: var(--oc-graphite); }
  .px  { font-family: var(--oc-font-mono); font-size: 10px; color: var(--oc-stone); text-align: right; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="head">
    <div class="eye">Spacing · 4px base</div>
    <div class="eye">11 steps</div>
  </div>
  <div class="row"><div class="tok">--oc-s-1</div><div class="bar" style="width:4px"></div><div class="px">04 px</div></div>
  <div class="row"><div class="tok">--oc-s-2</div><div class="bar" style="width:8px"></div><div class="px">08 px</div></div>
  <div class="row"><div class="tok">--oc-s-3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
  <div class="row"><div class="tok">--oc-s-4</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><div class="tok">--oc-s-5</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><div class="tok">--oc-s-6</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
  <div class="row"><div class="tok">--oc-s-7</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
  <div class="row"><div class="tok">--oc-s-8</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
  <div class="row"><div class="tok">--oc-s-9</div><div class="bar" style="width:96px"></div><div class="px">96 px</div></div>
  <div class="row"><div class="tok">--oc-s-10</div><div class="bar" style="width:128px"></div><div class="px">128 px</div></div>
  <div class="row"><div class="tok">--oc-s-11</div><div class="bar" style="width:192px"></div><div class="px">192 px</div></div>
</body>
</html>
