<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Oliver Co — Display type</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--oc-bone); padding: 28px 32px; font-family: var(--oc-font-sans); color: var(--oc-ink); }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 18px; }
  .eye  { font-family: var(--oc-font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--oc-stone); }
  .specimen { font-family: var(--oc-font-sans); font-weight: 300; font-size: 132px; line-height: 0.9; letter-spacing: -0.022em; }
  .meta { display:flex; justify-content:space-between; margin-top: 18px; font-family: var(--oc-font-mono); font-size: 11px; color: var(--oc-stone); letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="head">
    <div class="eye">Display · Aeonik Light 300</div>
    <div class="eye">132 / 0.9 / -0.022em</div>
  </div>
  <div class="specimen">Surface,<br/>evolving.</div>
  <div class="meta">
    <span>— Aeonik · Brand</span>
    <span>Used for: editorial titles, campaign</span>
  </div>
</body>
</html>
