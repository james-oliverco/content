<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Oliver Co — Tracking & casing</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--oc-bone); padding: 24px 28px; font-family: var(--oc-font-sans); color: var(--oc-ink); }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 18px; }
  .eye  { font-family: var(--oc-font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--oc-stone); }
  .row { display: grid; grid-template-columns: 1fr 240px; align-items: baseline; padding: 10px 0; border-bottom: var(--oc-hairline); gap: 16px; }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--oc-font-mono); font-size: 10px; color: var(--oc-stone); letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="head">
    <div class="eye">Tracking · casing · eyebrows</div>
    <div class="eye">No. 04 / 04</div>
  </div>
  <div class="row">
    <div style="font-weight:400; letter-spacing:0.20em; text-transform:uppercase; font-size:18px;">OLIVER CO</div>
    <div class="meta">Wordmark · 0.20em</div>
  </div>
  <div class="row">
    <div style="font-weight:500; letter-spacing:0.18em; text-transform:uppercase; font-size:11px; color:var(--oc-stone);">MATERIAL · INNOVATION · 2026</div>
    <div class="meta">Eyebrow · 11 · 0.18em</div>
  </div>
  <div class="row">
    <div style="font-weight:500; letter-spacing:0.14em; text-transform:uppercase; font-size:13px;">SHOP THE COLLECTION</div>
    <div class="meta">Nav / Button · 13 · 0.14em</div>
  </div>
  <div class="row">
    <div style="font-weight:400; letter-spacing:0.04em; text-transform:uppercase; font-size:10px; font-family:var(--oc-font-mono); color:var(--oc-stone);">— FORMED THROUGH REDUCTION</div>
    <div class="meta">Mono anno · 10 · 0.04em</div>
  </div>
</body>
</html>
