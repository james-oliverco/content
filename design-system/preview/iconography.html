<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Oliver Co — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--oc-bone); padding: 24px 28px; font-family: var(--oc-font-sans); color: var(--oc-ink); }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 18px; }
  .eye  { font-family: var(--oc-font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--oc-stone); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ic { width: 28px; height: 28px; color: var(--oc-graphite); display:flex; align-items:center; justify-content:center; }
  .ic svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
  .lab { font-family: var(--oc-font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--oc-stone); }
  .note { margin-top: 18px; font-family: var(--oc-font-mono); font-size: 10px; color: var(--oc-stone); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="head"><div class="eye">Iconography · hairline · 1px</div><div class="eye">Lucide · substitute</div></div>
  <div class="grid">
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg></div><div class="lab">Search</div></div>
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.5 11h-11z"/><path d="M9 8a3 3 0 016 0"/></svg></div><div class="lab">Bag</div></div>
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></div><div class="lab">Account</div></div>
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div><div class="lab">Close</div></div>
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div><div class="lab">Chevron</div></div>
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div class="lab">Plus</div></div>
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div><div class="lab">Minus</div></div>
    <div class="cell"><div class="ic"><svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></div><div class="lab">Arrow ↗</div></div>
  </div>
  <div class="note">— Stroke 1px · square caps · 24px grid · color: --oc-graphite at 80% opacity</div>
</body>
</html>
